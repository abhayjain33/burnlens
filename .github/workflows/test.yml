name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: burnlens --demo --no-open --out out/demo.html

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: burnlens, POSTGRES_PASSWORD: burnlens, POSTGRES_DB: burnlens_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U burnlens" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[server]"
      - run: python -m unittest tests.test_server -v
        env: { DATABASE_URL: "postgresql://burnlens:burnlens@localhost:5432/burnlens_test" }
      - run: docker build -t burnlens-server .
