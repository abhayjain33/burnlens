# burnlens org server: `docker compose -f deploy/docker-compose.yml up -d`
name: burnlens
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: burnlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnlens}
      POSTGRES_DB: burnlens
    volumes:
      - burnlens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnlens"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ..
    image: burnlens-server:latest
    environment:
      DATABASE_URL: postgresql://burnlens:${POSTGRES_PASSWORD:-burnlens}@db:5432/burnlens
      BURNLENS_SECURE_COOKIE: ${BURNLENS_SECURE_COOKIE:-0}
    ports:
      - "${BURNLENS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  burnlens-db:
