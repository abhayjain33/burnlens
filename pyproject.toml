[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnlens"
version = "0.1.0"
description = "See where your Claude Code tokens burn: by work type, tool, MCP server, subagent, skill and session."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
burnlens = "burnlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
burnlens = ["dashboard.html"]
